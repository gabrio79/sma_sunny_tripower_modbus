  ##############################################
  #### Inverter 1
  ##############################################
modbus:
  - name: SMA Inverter 1
    type: tcp
    host: 192.168.50.11
    port: 502
    sensors:

      - name: inverter_1_status_wip
        slave: 3
        address: 30201
        scan_interval: 60
        data_type: int32

      - name: Inverter 1 Daily Yield        
        slave: 3
        address: 30517
        data_type: int64
        scan_interval: 60
        scale: 0.001
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total

      - name: inverter_1_grid_power_wip
        slave: 3
        address: 30775
        data_type: int32
        scan_interval: 5
        precision: 1
        unit_of_measurement: W
        device_class: power
        state_class: measurement

      - name: Inverter 1 Total Yield
        slave: 3
        address: 30513
        data_type: int64
        scan_interval: 60
        scale: 0.001
        precision: 0
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing

      - name: inverter_1_temperature_wip
        slave: 3
        address: 30953
        data_type: int32
        scan_interval: 60
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: inverter_1_pv_power_c_wip
        slave: 3
        address: 30773
        data_type: int32
        scan_interval: 5
        precision: 1
        unit_of_measurement: W
        device_class: power
        state_class: measurement

      - name: inverter_1_pv_power_d_wip
        slave: 3
        address: 30961
        data_type: int32
        scan_interval: 5
        precision: 1
        unit_of_measurement: W
        device_class: power
        state_class: measurement

##############################################
#### Sensori che annullano mancato invio quando la produzione è nulla ed inverter va in standby
##############################################

template:
  - sensor:
      # Inverter 1 Potenza
      - name: "Inverter 1 grid Power"
        unique_id: inverter_1_grid_power
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_1_grid_power_wip') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ [0, states('sensor.inverter_1_grid_power_wip') | int(0)] | max }}

      # Inverter 1 Temperatura
      - name: "Inverter 1 Temperature"
        unique_id: inverter_1_temperature
        icon: mdi:thermometer
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_1_temperature_wip') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set temp = states('sensor.inverter_1_temperature_wip') | float(0) %}
          {{ temp if temp > -100 else 0 }}

      # Inverter 1 PV Power C
      - name: "Inverter 1 PV Power C"
        unique_id: inverter_1_pv_power_c
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_1_pv_power_c_wip') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ [0, states('sensor.inverter_1_pv_power_c_wip') | int(0)] | max }}

      # Inverter 1 PV Power D
      - name: "Inverter 1 PV Power D"
        unique_id: inverter_1_pv_power_d
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_1_pv_power_d_wip') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ [0, states('sensor.inverter_1_pv_power_d_wip') | int(0)] | max }}

      # Inverter 1 Stato
      - name: "Inverter 1 Status"
        unique_id: inverter_1_status
        icon: mdi:information-outline
        state: >
          {% if is_state('sensor.inverter_1_status_wip', '307') %}
            OK
          {% elif is_state('sensor.inverter_1_status_wip', '303') %}
            Spento
          {% elif is_state('sensor.inverter_1_status_wip', '455') %}
            Attenzione
          {% elif is_state('sensor.inverter_1_status_wip', '35') %}
            Errore
          {% else %}
            Sconosciuto
          {% endif %}