# ==============================================================================
# SCHEDA LOVELACE ALL-IN-ONE PER INVERTER SMA SUNNY TRIPOWER
# ==============================================================================
# Card personalizzata standalone (custom:sma-tripower-card) con tutto integrato:
# - Schematica vettoriale integrata ad alta risoluzione (SVG nativo incorporato)
# - Flussi di energia animati in tempo reale (stringhe -> inverter -> rete)
# - Display digitale stile LCD SMA e indicatore LED di stato operativo
# - Telemetria completa: Oggi, Totale, Temperatura, Rendimento, Stato
# - Nessun file SVG esterno da copiare né coordinate da configurare!
# ==============================================================================

# ------------------------------------------------------------------------------
# ESEMPIO 1: Configurazione Base Automatica per Inverter 1
# ------------------------------------------------------------------------------
type: custom:sma-tripower-card
title: "Inverter 1 - SMA Sunny Tripower"
inverter: "inverter_1"
animation: true

