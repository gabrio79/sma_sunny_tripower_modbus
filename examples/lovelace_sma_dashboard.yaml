# ==============================================================================
# DASHBOARD LOVELACE - SMA SUNNY TRIPOWER (SCHEMATICA VETTORIALE INTERATTIVA)
# ==============================================================================
# ISTRUZIONI:
# 1. Copia il file "images/sma_inverter_vector.svg" nella cartella "www" di Home Assistant
#    (percorso completo: /config/www/sma_inverter_vector.svg).
#    Se la cartella "www" non esiste, creala e riavvia Home Assistant.
# 2. In Home Assistant: Modifica Dashboard -> Aggiungi scheda -> Scheda Manuale (YAML).
# 3. Incolla il codice sottostante. Sostituisci "inverter_1" con "inverter_2" per il secondo inverter.
# ==============================================================================

type: vertical-stack
title: Inverter Fotovoltaico SMA Sunny Tripower
cards:

  # ----------------------------------------------------------------------------
  # 1. SCHEMATICA VETTORIALE DINAMICA (PICTURE-ELEMENTS)
  # ----------------------------------------------------------------------------
  - type: picture-elements
    image: /local/sma_inverter_vector.svg
    elements:

      # Valore Potenza Stringa 1 (MPPT 1)
      - type: state-label
        entity: sensor.inverter_1_potenza_fv_c # o sensor.inverter_1_potenza_fv_a
        style:
          top: 36.5%
          left: 16.5%
          color: "#FF9F43"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 16px
          font-weight: 800
          text-shadow: "0px 0px 8px rgba(255, 159, 67, 0.6)"
          pointer-events: none

      # Valore Potenza Stringa 2 (MPPT 2)
      - type: state-label
        entity: sensor.inverter_1_potenza_fv_d # o sensor.inverter_1_potenza_fv_b
        style:
          top: 68.5%
          left: 16.5%
          color: "#FF9F43"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 16px
          font-weight: 800
          text-shadow: "0px 0px 8px rgba(255, 159, 67, 0.6)"
          pointer-events: none

      # Stato Operativo Inverter (Centro LCD)
      - type: state-label
        entity: sensor.inverter_1_stato
        style:
          top: 32%
          left: 55%
          color: "#1DD1A1"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 18px
          font-weight: 800
          text-transform: uppercase
          letter-spacing: 1.5px
          text-shadow: "0px 0px 10px rgba(29, 209, 161, 0.7)"

      # Temperatura Interna Inverter
      - type: state-label
        entity: sensor.inverter_1_temperatura
        style:
          top: 44.5%
          left: 57%
          color: "#F8FAFC"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 15px
          font-weight: 700

      # Valore Potenza di Rete Immessa (AC Grid Power)
      - type: state-label
        entity: sensor.inverter_1_potenza_di_rete
        style:
          top: 36.5%
          left: 83.5%
          color: "#10AC84"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 18px
          font-weight: 800
          text-shadow: "0px 0px 10px rgba(16, 172, 132, 0.7)"
          pointer-events: none

      # Produzione Giornaliera (kWh)
      - type: state-label
        entity: sensor.inverter_1_produzione_giornaliera
        style:
          top: 52%
          left: 83.5%
          color: "#38BDF8"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 16px
          font-weight: 700
          pointer-events: none

      # Produzione Totale Cumulativa (kWh)
      - type: state-label
        entity: sensor.inverter_1_produzione_totale
        style:
          top: 68.5%
          left: 83.5%
          color: "#E2E8F0"
          font-family: "'Segoe UI', Roboto, sans-serif"
          font-size: 15px
          font-weight: 700
          pointer-events: none

  # ----------------------------------------------------------------------------
  # 2. INDICATORI A STRUMENTO (GAUGES IN TEMPO REALE)
  # ----------------------------------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.inverter_1_potenza_di_rete
        name: Potenza Rete AC
        min: 0
        max: 6000
        needle: true
        severity:
          green: 1500
          yellow: 500
          red: 0

      - type: gauge
        entity: sensor.inverter_1_temperatura
        name: Temperatura
        min: 0
        max: 85
        needle: true
        severity:
          green: 0
          yellow: 50
          red: 70

  # ----------------------------------------------------------------------------
  # 3. STATISTICHE DI RENDIMENTO ENERGETICO (GRID CARD)
  # ----------------------------------------------------------------------------
  - type: glance
    show_name: true
    show_state: true
    show_icon: true
    columns: 4
    entities:
      - entity: sensor.inverter_1_potenza_fv_c
        name: Stringa C
      - entity: sensor.inverter_1_potenza_fv_d
        name: Stringa D
      - entity: sensor.inverter_1_produzione_giornaliera
        name: Resa Oggi
      - entity: sensor.inverter_1_produzione_totale
        name: Resa Totale
